<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>大纽约青年人服事</title>
<style>
  :root{
    --ink:#17233b; --muted:#6f7787; --paper:#fffdf8; --canvas:#f4f1e9;
    --line:#e5e0d5; --navy:#14233d; --navy-2:#223a61; --gold:#d6a954;

  *{ box-sizing:border-box; }
  html{ color-scheme:light; }
  body{ margin:0; min-height:100vh; color:var(--ink); background:var(--canvas); font-family:"Avenir Next","PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  button,input,textarea{ font:inherit; }
  button{ color:inherit; }
  header{ position:relative; overflow:hidden; color:#fff; background:linear-gradient(120deg,var(--navy) 0%,#1a3153 62%,#294b71 100%); }
  header::after{ content:""; position:absolute; width:380px; height:380px; right:-130px; top:-230px; border:70px solid rgba(214,169,84,.13); border-radius:50%; }
  .header-inner{ position:relative; z-index:1; max-width:1240px; margin:0 auto; padding:30px 28px 34px; display:flex; align-items:center; justify-content:space-between; gap:24px; }

  .eyebrow{ margin:0 0 4px; color:#e9c77f; font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; }
  header h1{ margin:0; font-family:Georgia,"Songti SC",serif; font-size:clamp(25px,3vw,36px); font-weight:600; letter-spacing:.02em; }
  .subtitle{ margin:6px 0 0; color:rgba(255,255,255,.68); font-size:13px; }
  .sync-indicator{ min-width:132px; padding:9px 13px; border:1px solid rgba(255,255,255,.16); border-radius:999px; background:rgba(0,0,0,.12); color:rgba(255,255,255,.78); font-size:12px; text-align:center; }
  main{ width:min(1240px,calc(100% - 40px)); margin:0 auto; padding:24px 0 42px; }
  .control-panel{ margin-top:-18px; position:relative; z-index:2; padding:16px; border:1px solid rgba(221,215,202,.9); border-radius:18px; background:rgba(255,253,248,.97); box-shadow:0 15px 40px rgba(28,38,55,.10); }
  .toolbar{ display:flex; flex-wrap:wrap; align-items:center; gap:9px; }
  .add-group{ display:flex; flex:1 1 330px; min-width:260px; }
  .toolbar input[type="text"]{ width:100%; min-height:42px; padding:10px 14px; border:1px solid var(--line); border-right:0; border-radius:11px 0 0 11px; outline:none; background:#fff; color:var(--ink); }
  .toolbar input[type="text"]:focus{ border-color:#8ea5c4; box-shadow:0 0 0 3px rgba(79,126,217,.10); }
  .toolbar button,.bulk button{ min-height:38px; padding:8px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; cursor:pointer; font-size:12px; font-weight:650; transition:transform .14s ease,border-color .14s ease,box-shadow .14s ease,background .14s ease; }

  #addBtn{ min-width:86px; border-color:var(--navy); border-radius:0 11px 11px 0; color:#fff; background:var(--navy); }

  #googleLoadBtn{ color:#285d50; border-color:#bad8cf; background:#edf8f4; }
  .toolbar-divider{ width:1px; height:28px; background:var(--line); margin:0 2px; }
  .bulk{ display:none; margin-top:14px; padding:16px; border:1px solid #ded7c8; border-radius:13px; background:#faf7ef; }
  .bulk-head{ display:flex; gap:8px; align-items:baseline; margin-bottom:8px; }

  .small,.muted{ color:var(--muted); font-size:12px; }

  .list{ flex:1; padding:11px; display:grid; grid-auto-rows:min-content; gap:8px; }
  .item{ position:relative; min-width:0; padding:10px 9px 10px 13px; display:flex; justify-content:space-between; align-items:center; gap:8px; overflow:hidden; border:1px solid #e5e1d8; border-radius:11px; background:#fff; cursor:grab; user-select:none; box-shadow:0 2px 6px rgba(20,35,61,.035); transition:transform .14s ease,border-color .14s ease,box-shadow .14s ease; }
  .item::before{ content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:0 4px 4px 0; }

  .item:hover{ transform:translateY(-1px); border-color:#ccc3b4; box-shadow:0 7px 16px rgba(20,35,61,.08); }

  .panel-heading{ display:flex; justify-content:space-between; align-items:start; gap:18px; margin-bottom:15px; }
  .bottom-rows{ display:grid; grid-template-columns:1fr 1fr; gap:13px; }

  .bcol[data-bcat="member"] h4::before{ background:var(--yes); }.bcol[data-bcat="friend"] h4::before{ background:var(--gold); }
  .bcount{ color:var(--muted); font-size:11px; }

  .btag{ padding:7px 10px; border:1px solid #ded9ce; border-radius:999px; background:#fff; cursor:grab; user-select:none; font-size:12px; line-height:1; }
  .bcol[data-bcat="member"] .btag{ color:#246a56; border-color:#cae2da; background:#f0f8f5; }.bcol[data-bcat="friend"] .btag{ color:#7c5b20; border-color:#ead9b8; background:#fff8e9; }
  .panel-note{ margin:12px 1px 0; color:var(--muted); font-size:11px; }
  .note-dialog{ width:min(470px,calc(100% - 28px)); padding:0; overflow:hidden; border:1px solid #dfd8cb; border-radius:18px; color:var(--ink); background:var(--paper); box-shadow:0 28px 80px rgba(15,27,45,.28); }

<script>
(function(){
  const $  = (sel)=>document.querySelector(sel);
  const $$ = (sel)=>Array.from(document.querySelectorAll(sel));
  const storeKey = 'invite_manager_v2';

  const STATUS_LABEL = { pool:"邀请", yes:"确定", maybe:"待定", no:"不来" };
  let activeListKey = 'main';

  function emptyListData(){
    return {
      people: [], statuses: {},
      order: { pool:[], yes:[], maybe:[], no:[] },
      personNotes: {}
    };
  }

  function getListData(state, key=activeListKey){
    if(key === 'main') return state;
    state.campaigns = state.campaigns || {};
    state.campaigns[key] = state.campaigns[key] || emptyListData();
    return state.campaigns[key];
  }

  // —— 下方分类映射：id -> 'member' | 'friend'
  function ensureBottomTypes(state){
    if(!state.bottomTypes) state.bottomTypes = {};
    const fallPeople = state.campaigns?.fall2026?.people || [];
    const allPeople = (state.people||[]).concat(fallPeople);
    const valid = new Set(allPeople.map(p=>p.id));
    Object.keys(state.bottomTypes).forEach(id=>{ if(!valid.has(id)) delete state.bottomTypes[id]; });
    allPeople.forEach(p=>{ if(!state.bottomTypes[p.id]) state.bottomTypes[p.id] = 'friend'; });
  }

  // —— 载入（带自修复：四列顺序 + 底部分类/顺序）
  function load(){
    const raw = localStorage.getItem(storeKey);
    if(!raw){
      const init = {
        people: [], statuses: {}, history: [],
        order: { pool:[], yes:[], maybe:[], no:[] },
        bottomTypes: {},
        bottomOrder: { member:[], friend:[] },
        personNotes: {}, // personId -> note 文本
        campaigns: { fall2026: emptyListData() },
        notices: []
      };
      localStorage.setItem(storeKey, JSON.stringify(init));
      return init;
    }
    let state; try{ state = JSON.parse(raw); }catch{ state = {}; }

    if(!state.people)   state.people   = [];
    if(!state.statuses) state.statuses = {};
    if(!state.history)  state.history  = [];
    if(!state.order)    state.order    = { pool:[], yes:[], maybe:[], no:[] };
    if(!state.bottomTypes)  state.bottomTypes  = {};
    if(!state.bottomOrder)  state.bottomOrder  = { member:[], friend:[] };
    if(!state.personNotes) state.personNotes = {};
    if(!state.campaigns) state.campaigns = {};
    if(!state.campaigns.fall2026) state.campaigns.fall2026 = emptyListData();
    if(!Array.isArray(state.notices)) state.notices = [];

    const fall = state.campaigns.fall2026;
    if(!fall.people) fall.people = [];
    if(!fall.statuses) fall.statuses = {};
    if(!fall.order) fall.order = { pool:[], yes:[], maybe:[], no:[] };
    if(!fall.personNotes) fall.personNotes = {};

    ensureBottomTypes(state);

    // 顶部四列顺序自修复
    const validIds = new Set(state.people.map(p=>p.id));
    const bySt = { pool:[], yes:[], maybe:[], no:[] };
    state.people.forEach(p=>{
      const st = state.statuses[p.id] || 'pool';
      bySt[st].push(p.id);
    });
    ['pool','yes','maybe','no'].forEach(st=>{
      state.order[st] = (state.order[st]||[]).filter(id => validIds.has(id) && bySt[st].includes(id));
      bySt[st].forEach(id=>{ if(!state.order[st].includes(id)) state.order[st].push(id); });
    });

    // 开学季四列顺序自修复（独立于主名单）
    const fallIds = new Set(fall.people.map(p=>p.id));
    const fallBySt = { pool:[], yes:[], maybe:[], no:[] };
    fall.people.forEach(p=> fallBySt[fall.statuses[p.id] || 'pool'].push(p.id));
    ['pool','yes','maybe','no'].forEach(st=>{
      fall.order[st] = (fall.order[st]||[]).filter(id=>fallIds.has(id) && fallBySt[st].includes(id));
      fallBySt[st].forEach(id=>{ if(!fall.order[st].includes(id)) fall.order[st].push(id); });
    });

    // Group 顺序自修复（主名单 + 开学季名单）
    const bottomValidIds = new Set([...validIds, ...fallIds]);
    ['member','friend'].forEach(k=>{
      state.bottomOrder[k] = [...new Set(state.bottomOrder[k]||[])]
        .filter(id=>bottomValidIds.has(id) && state.bottomTypes[id] === k);
    });
    state.people.concat(fall.people).forEach(p=>{
      const cat = state.bottomTypes[p.id] || 'friend';
      const arr = state.bottomOrder[cat];
      if(!arr.includes(p.id)) arr.push(p.id);
    });

    return state;
  }
  let autoSyncEnabled = false;
  let autoSyncTimer = null;
  let localChangesPending = false;

  function save(state){
    localStorage.setItem(storeKey, JSON.stringify(state));
    if(autoSyncEnabled){
      localChangesPending = true;
      scheduleAutoSync();
    }
  }

  function normalizedName(name){ return (name||'').trim().replace(/\s+/g,' '); }
  function existsByName(data, name){
    const target = name.toLowerCase();
    return data.people.some(p => (p.name||'').trim().toLowerCase() === target);
  }

  function addPerson(name, allowDup=false){
    const state = load();
    const data = getListData(state);
    const nm = normalizedName(name);
    if(!nm) return;
    if(!allowDup && existsByName(data, nm)) return;
    const id = 'p_' + Math.random().toString(36).slice(2,10);
    data.people.push({id, name: nm});
    data.statuses[id] = 'pool';

    // 顶部顺序：加入“邀请”最前面
    if(!data.order) data.order = { pool:[], yes:[], maybe:[], no:[] };
    data.order.pool.unshift(id);

    // 下方分类与顺序
    ensureBottomTypes(state);
    state.bottomTypes[id] = 'friend';
    if(!state.bottomOrder) state.bottomOrder = { member:[], friend:[] };
    state.bottomOrder.friend.push(id);

    save(state); render();
  }

  function bulkAdd(text, allowDup=false){
    const sep = /[,\n\r;、，；]+/;
    const parts = (text||'').split(sep).map(s => normalizedName(s)).filter(Boolean);
    const state = load();
    const data = getListData(state);
    const addedIds = [];
    parts.forEach(nm=>{
      if(!allowDup && existsByName(data, nm)) return;
      const id = 'p_' + Math.random().toString(36).slice(2,10);
      data.people.push({id, name: nm});
      data.statuses[id] = 'pool';
      if(!data.order) data.order = { pool:[], yes:[], maybe:[], no:[] };
      addedIds.push(id);
      ensureBottomTypes(state);
      if(!state.bottomOrder) state.bottomOrder = { member:[], friend:[] };
      state.bottomTypes[id] = 'friend';
      state.bottomOrder.friend.push(id);
    });
    // 批量新增整体放在最前面，同时保持输入顺序。
    data.order.pool = addedIds.concat(data.order.pool);
    save(state); render();
  }

  function setStatus(id, status){
    const state = load();
    getListData(state).statuses[id] = status;
    save(state);
    render();
  }

  // —— 渲染
  function render(){
    const state = load();
    const data = getListData(state);
    const lists = { pool: $('#list-pool'), yes: $('#list-yes'), maybe: $('#list-maybe'), no: $('#list-no') };
    Object.values(lists).forEach(ul => ul.innerHTML='');

    const id2p = {}; (data.people||[]).forEach(p=> id2p[p.id]=p);

    ['pool','yes','maybe','no'].forEach(st=>{
      const ul = lists[st];
      let ids = (data.order && data.order[st]) ? data.order[st].slice() : [];
      if(!ids || ids.length === 0){
        ids = (data.people||[])
          .filter(p => (data.statuses[p.id] || 'pool') === st)
          .map(p => p.id);
      }
      let has = false;
      ids.forEach(id=>{
        const p = id2p[id];
        if(!p) return;
        const cur = data.statuses[p.id] || 'pool';
        if(cur !== st) return;
        const el = document.createElement('div');
        el.className = 'item'; el.draggable = true; el.dataset.id = p.id;
        el.innerHTML = `
          <span class="name">${escapeHTML(p.name)}</span>
          <span class="actions">
            <button class="chip${(data.personNotes[p.id]||'').trim() ? ' has-note' : ''}" data-action="details">详情</button>
            <button class="chip icon-btn" data-action="rename" title="编辑姓名和备注" aria-label="编辑姓名和备注">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>
            </button>
          </span>`;
        ul.appendChild(el); has = true;
      });
      if(!has) ul.innerHTML = '<div class="empty">暂无名单，请先添加。</div>';
    });

    enableDnDSortable();     // 顶部四列：可插队拖拽 + 跨列
    enableItemActions();
    renderCounts();
    renderBottomPanel();
    renderNotices();

  }

  function renderCounts(){
    const state = load();
    const data = getListData(state);
    const counts = { pool:0, yes:0, no:0, maybe:0 };

    $('#count-yes').textContent = counts.yes;

  function renderNotices(){
    const state = load();
    const list = $('#noticeList');
    if(!list) return;
    list.innerHTML = '';
    const notices = (state.notices||[]).slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
    if(!notices.length){
      list.innerHTML = '<div class="notice-empty">还没有公告</div>';
      return;
    }
    notices.forEach(notice=>{
      const item = document.createElement('article');
      item.className = 'notice-item';
      const text = document.createElement('p');
      text.className = 'notice-text';
      text.textContent = notice.text || '';
      const meta = document.createElement('div');
      meta.className = 'notice-meta';
      const time = document.createElement('span');
      time.textContent = notice.createdAt ? new Date(notice.createdAt).toLocaleString('zh-CN') : '';
      const actions = document.createElement('span');
      actions.className = 'notice-actions';
      actions.innerHTML = '<button type="button" data-action="edit">编辑</button><button type="button" data-action="delete">删除</button>';
      actions.addEventListener('click', e=>{
        const action = e.target.dataset.action;
        if(!action) return;
        const latest = load();
        const target = (latest.notices||[]).find(n=>n.id===notice.id);
        if(!target) return;
        if(action === 'edit'){
          const value = prompt('编辑公告：', target.text || '');
          if(value === null || !value.trim()) return;
          target.text = value.trim();
          target.updatedAt = new Date().toISOString();
        }else if(action === 'delete'){
          if(!confirm('确定删除这条公告？')) return;
          latest.notices = latest.notices.filter(n=>n.id!==notice.id);
        }
        save(latest);
        renderNotices();
      });
      meta.append(time, actions);
      item.append(text, meta);
      list.appendChild(item);
    });
  }

  function addNotice(){
    const input = $('#noticeInput');
    const text = (input.value||'').trim();
    if(!text) return;
    const state = load();
    state.notices = state.notices || [];
    state.notices.push({ id:'n_'+Math.random().toString(36).slice(2,10), text, createdAt:new Date().toISOString() });
    input.value = '';
    save(state);
    renderNotices();
  }

  // —— 下方分类（按 bottomOrder 渲染 + 兜底）
  function renderBottomPanel(){
    const state = load();
    ensureBottomTypes(state);
    if(!state.bottomOrder) state.bottomOrder = { member: [], friend: [] };

    const memberList = document.getElementById('list-member');
    const friendList = document.getElementById('list-friend');
    memberList.innerHTML = ''; friendList.innerHTML = '';

    const fallPeople = state.campaigns?.fall2026?.people || [];
    const allPeople = (state.people||[]).concat(fallPeople);
    const fallIds = new Set(fallPeople.map(p=>p.id));
    const id2p = {}; allPeople.forEach(p=> id2p[p.id]=p);

    let memberIds = (state.bottomOrder.member||[]).slice();
    let friendIds = (state.bottomOrder.friend||[]).slice();

    allPeople.forEach(p=>{
      const cat = state.bottomTypes[p.id] || 'friend';
      if(cat === 'member'){
        if(!memberIds.includes(p.id)) memberIds.push(p.id);
      }else{
        if(!friendIds.includes(p.id)) friendIds.push(p.id);
      }
    });

    let memberCnt=0, friendCnt=0;
    const renderedIds = new Set();
    memberIds.forEach(id=>{
      const p = id2p[id]; if(!p || renderedIds.has(id)) return;
      renderedIds.add(id);
      const tag = document.createElement('div');
      tag.className = 'btag'; tag.draggable = true; tag.dataset.id = id;
      tag.textContent = p.name || '';
      memberList.appendChild(tag); memberCnt++;
    });
    friendIds.forEach(id=>{
      const p = id2p[id]; if(!p || renderedIds.has(id)) return;
      renderedIds.add(id);
      const tag = document.createElement('div');
      tag.className = 'btag'; tag.draggable = true; tag.dataset.id = id;
      tag.textContent = p.name || '';
      friendList.appendChild(tag); friendCnt++;
    });

    document.getElementById('bcount-member').textContent = memberCnt;
    document.getElementById('bcount-friend').textContent = friendCnt;

    enableBottomDnDSortable();
  }

  // —— 顶部四列拖拽：列内排序 + 跨列移动 + 持久化
  function enableDnDSortable(){
    const cols = $$('.col .list');
    let draggingEl = null;
    let dropHandled = false;

    function getAfterElement(container, y){
      const els = [...container.querySelectorAll('.item:not(.dragging)')];
      let closest = {offset: Number.NEGATIVE_INFINITY, el: null};
      els.forEach(el=>{
        const box = el.getBoundingClientRect();
        const offset = y - (box.top + box.height/2);
        if(offset < 0 && offset > closest.offset){
          closest = {offset, el};
        }
      });
      return closest.el;
    }

    $$('.item').forEach(el=>{
      el.addEventListener('dragstart', e=>{
        draggingEl = el;
        dropHandled = false;
        el.classList.add('dragging');
        try{ e.dataTransfer.setData('text/plain', el.dataset.id); e.dataTransfer.effectAllowed='move'; }catch(_){}
      });
      el.addEventListener('dragend', ()=>{
        el.classList.remove('dragging');
        draggingEl = null;
        // drop 已经保存过时不再重复保存。
        if(!dropHandled) persistCurrentOrder();
        dropHandled = false;
      });
    });

    cols.forEach(list=>{
      list.addEventListener('dragover', e=>{
        e.preventDefault();
        list.querySelector('.empty')?.remove();
        const after = getAfterElement(list, e.clientY);
        if(!draggingEl) return;
        if(after == null) list.appendChild(draggingEl);
        else list.insertBefore(draggingEl, after);
      });

      list.addEventListener('drop', e=>{
        e.preventDefault();
        dropHandled = true;
        const id = (e.dataTransfer && e.dataTransfer.getData('text/plain')) || (draggingEl && draggingEl.dataset.id);
        const status = list.parentElement.dataset.status; // pool/yes/maybe/no
        if(!id || !status) return;

        const state = load();
        const data = getListData(state);
        if(!data.order) data.order = { pool:[], yes:[], maybe:[], no:[] };

        data.statuses[id] = status;
        ['pool','yes','maybe','no'].forEach(st=>{
          data.order[st] = (data.order[st]||[]).filter(x=>x!==id);
        });

        const ids = [...list.querySelectorAll('.item')].map(x=>x.dataset.id);
        data.order[status] = ids;

        save(state);
        renderCounts();
      });
    });

    function persistCurrentOrder(){
      const state = load();
      const data = getListData(state);
      ['pool','yes','maybe','no'].forEach(st=>{
        const list = document.querySelector(`.col[data-status="${st}"] .list`);
        if(!list) return;
        data.order[st] = [...list.querySelectorAll('.item')].map(x=>x.dataset.id);
      });
      save(state);
    }
  }

  // —— 下方分类拖拽：列内排序 + 跨列移动 + 持久化
  function enableBottomDnDSortable(){
    const memberList = document.getElementById('list-member');
    const friendList = document.getElementById('list-friend');
    const lists = [memberList, friendList];
    let draggingEl = null;
    let dropHandled = false;

    function getAfterElement(container, y){
      const els = [...container.querySelectorAll('.btag:not(.dragging)')];
      let closest = {offset: Number.NEGATIVE_INFINITY, el: null};
      els.forEach(el=>{
        const box = el.getBoundingClientRect();
        const offset = y - (box.top + box.height/2);
        if(offset < 0 && offset > closest.offset){
          closest = {offset, el};
        }
      });
      return closest.el;
    }

    lists.forEach(list=>{
      [...list.querySelectorAll('.btag')].forEach(el=>{
        el.addEventListener('dragstart', e=>{
          draggingEl = el;
          dropHandled = false;
          el.classList.add('dragging');
          try{ e.dataTransfer.setData('text/plain', el.dataset.id); e.dataTransfer.effectAllowed='move'; }catch(_){}
        });
        el.addEventListener('dragend', ()=>{
          el.classList.remove('dragging');
          draggingEl = null;
          if(!dropHandled) persistBottomOrder();
          dropHandled = false;
        });
      });
    });

    lists.forEach(list=>{
      list.addEventListener('dragover', e=>{
        e.preventDefault();
        const after = getAfterElement(list, e.clientY);
        if(!draggingEl) return;
        if(after == null) list.appendChild(draggingEl);
        else list.insertBefore(draggingEl, after);
        list.classList.add('drop-hint');
      });
      list.addEventListener('dragleave', e=>{
        if(!list.contains(e.relatedTarget)) list.classList.remove('drop-hint');
      });
      list.addEventListener('drop', e=>{
        e.preventDefault();
        dropHandled = true;
        list.classList.remove('drop-hint');

        const id = (e.dataTransfer && e.dataTransfer.getData('text/plain')) || (draggingEl && draggingEl.dataset.id);
        if(!id) return;

        const state = load();
        if(!state.bottomTypes) state.bottomTypes = {};
        if(!state.bottomOrder) state.bottomOrder = { member:[], friend:[] };

        const targetCat = (list.id === 'list-member') ? 'member' : 'friend';
        state.bottomTypes[id] = targetCat;

        ['member','friend'].forEach(k=>{
          state.bottomOrder[k] = (state.bottomOrder[k]||[]).filter(x=>x!==id);
        });

        const ids = [...list.querySelectorAll('.btag')].map(x=>x.dataset.id);
        state.bottomOrder[targetCat] = ids;

        save(state);
        document.getElementById('bcount-member').textContent = memberList.querySelectorAll('.btag').length;
        document.getElementById('bcount-friend').textContent = friendList.querySelectorAll('.btag').length;
      });
    });

    function persistBottomOrder(){
      const state = load();
      if(!state.bottomOrder) state.bottomOrder = { member:[], friend:[] };
      state.bottomOrder.member = [...memberList.querySelectorAll('.btag')].map(x=>x.dataset.id);
      state.bottomOrder.friend = [...friendList.querySelectorAll('.btag')].map(x=>x.dataset.id);
      save(state);
    }
  }

  // —— PNG 导出（含下方分类区）
function exportBoardPNG(){
  try{
    // ===== 基本配置（导出更清晰）=====
    const scale   = 2;
    const baseW   = 700;    // 画布逻辑宽度
    const COL_W   = 160;    // 上方单列宽
    const COL_GAP = 12;
    const P       = 24;     // 外边距
    const HEADER_H= 52;     // 顶部标题/日期区
    const ROW_H   = 28;     // 上方姓名卡片高度
    const ROW_GAP = 6;
    const FOOTER_H= 24;

    // —— 分类区尺寸
    const SECTION_GAP = 16; // 四列与分类区之间的间距
    const BOX_GAP     = 12; // 两个分类框之间的水平间距
    const BOX_PAD     = 10; // 分类框内边距
    const TAG_H       = 20; // 分类区姓名标签高度
    const TAG_GAP     = 6;  // 标签之间的间距
    const TAG_PAD_X   = 10; // 标签左右内边距
    const TITLE_H     = 22; // 每个分类框标题高度
    const SECTION_TITLE_H = 20; // “下方分类”标题高度

    // ===== 取当前页面数据 =====
    const state   = load();
    const activeData = getListData(state);
    let people  = activeData.people || [];
    let statuses= activeData.statuses || {};

    // 上方四列分桶
    const buckets = { pool:[], yes:[], maybe:[], no:[] };
    people.forEach(p=>{
      const st = statuses[p.id] || 'pool';
      (buckets[st]||buckets.pool).push(p.name || '');
    });

    // —— 下方分类的数据（用当前页面的分类与顺序）
    const id2name = {}; (people||[]).forEach(p=> id2name[p.id] = p.name || '');
    const bottomTypes = state.bottomTypes || {};
    const bottomOrder = state.bottomOrder || {member:[], friend:[]};

    function collectBottom(cat){
      const ordered = (bottomOrder[cat]||[]).filter(id=>id2name[id]).map(id=>id2name[id]);
      // 把顺序里没有但类型属于该类的也补上
      const extra = [];
      Object.keys(bottomTypes).forEach(id=>{
        if(bottomTypes[id] === cat && id2name[id] && !ordered.includes(id2name[id])){
          extra.push(id2name[id]);
        }
      });
      return ordered.concat(extra);
    }
    const members = collectBottom('member');
    const friends = collectBottom('friend');

    // ===== 先预计算高度（需要测量文本宽度）=====
    // 用一个临时 ctx 来测量标签宽度，决定行数/高度
    const tempCanvas = document.createElement('canvas');
    const tctx = tempCanvas.getContext('2d');
    function setMeasureFont(px,bold=false){
      tctx.font = `${bold?'600 ':''}${px}px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"PingFang SC","Microsoft YaHei"`;
    }
    setMeasureFont(12,false);

    const colsMaxRows = Math.max(
      buckets.pool.length, buckets.yes.length, buckets.maybe.length, buckets.no.length, 1
    );
    const BODY_H  = 40 + (ROW_H + ROW_GAP) * colsMaxRows; // 上方四列高度（卡片区）
    const topPartH = P + HEADER_H + BODY_H;               // 上方总高（不含页脚）

    // 分类框宽度（两列）
    const totalW  = baseW - P*2;
    const boxW    = (totalW - BOX_GAP) / 2;

    function measureBoxHeight(names){
      let x = 0, rows = 0;
      names.forEach(n=>{
        const text = String(n||'').trim();
        const w = Math.ceil(tctx.measureText(text).width) + TAG_PAD_X*2;
        if(x === 0){ // 行首
          x = w; rows = 1;
        }else{
          if(x + TAG_GAP + w <= boxW - BOX_PAD*2){
            x += TAG_GAP + w;
          }else{
            rows += 1; x = w;
          }
        }
      });
      if(rows === 0) rows = 1; // 最少一行
      // 盒子高度 = 顶部标题 + 间距 + rows 行标签 + 内边距
      return BOX_PAD + TITLE_H + 6 + rows*TAG_H + (rows-1)*TAG_GAP + BOX_PAD;
    }
    const memberBoxH = measureBoxHeight(members);
    const friendBoxH = measureBoxHeight(friends);
    const bottomBoxesH = Math.max(memberBoxH, friendBoxH);
    const bottomSectionH = SECTION_GAP + SECTION_TITLE_H + 8 + bottomBoxesH; // 包含“下方分类”标题

    // 总高度
    const Hbase = topPartH + bottomSectionH + FOOTER_H + P;

    // ===== 正式画布 =====
    const W = baseW * scale, H = Hbase * scale;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);

    // 颜色
    const COLORS = {
      bg:'#f7f7f8', card:'#fff', text:'#111', line:'#e6e6e6',
      pool:'#6aa5ff', yes:'#35c28d', maybe:'#f2c94c', no:'#ef5b6b'
    };

    function setFont(px,bold=false){
      ctx.font = `${bold?'600 ':''}${px}px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"PingFang SC","Microsoft YaHei"`;
    }
    function roundRectPath(ctx, x, y, w, h, r){
      const rr = Math.max(0, Math.min(r || 8, w/2, h/2));
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.lineTo(x + w - rr, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
      ctx.lineTo(x + w, y + h - rr);
      ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
      ctx.lineTo(x + rr, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
      ctx.lineTo(x, y + rr);
      ctx.quadraticCurveTo(x, y, x + rr, y);
      ctx.closePath();
    }
    function fitText(t,maxW){
      let s = String(t || '');
      while (ctx.measureText(s).width > maxW) {
        if (s.length <= 1) break;
        s = s.slice(0,-1);
      }
      return s !== t ? s + '…' : s;
    }

    // 背景
    ctx.fillStyle = COLORS.bg; ctx.fillRect(0,0,baseW,Hbase);

    // 顶部标题
    const topY = P;

    setFont(22,true); ctx.fillStyle = COLORS.text; ctx.textAlign = 'center';
    ctx.fillText('主日下午LIC聚会邀请', baseW/2, topY + 24);

    // 上方四列
    const cols = [
      {key:'pool',  title:'邀请', color:COLORS.pool},
      {key:'yes',   title:'确定', color:COLORS.yes},
      {key:'maybe', title:'待定', color:COLORS.maybe},
      {key:'no',    title:'不来', color:COLORS.no}
    ];
    const totalColsW  = 4*COL_W + 3*COL_GAP;
    const leftPad = (baseW - totalColsW) / 2;
    const colsTop = topY + HEADER_H;

    cols.forEach((c,idx)=>{
      const x = leftPad + idx*(COL_W + COL_GAP);
      const y = colsTop;

      ctx.fillStyle = COLORS.card; roundRectPath(ctx, x, y, COL_W, BODY_H, 10); ctx.fill();
      ctx.strokeStyle = COLORS.line; ctx.lineWidth = 1; roundRectPath(ctx, x, y, COL_W, BODY_H, 10); ctx.stroke();

      setFont(14,true); ctx.fillStyle = COLORS.text;
      ctx.fillText(c.title, x + 10, y + 22);
      ctx.fillStyle = c.color; ctx.beginPath(); ctx.arc(x + COL_W - 14, y + 16, 5, 0, Math.PI*2); ctx.fill();

      setFont(12,false);
      let cy = y + 36;
      (buckets[c.key] || []).forEach(nm=>{
        const iw = COL_W - 20, ih = ROW_H;
        ctx.fillStyle = '#fafafa'; roundRectPath(ctx, x+10, cy, iw, ih, 6); ctx.fill();
        ctx.strokeStyle = COLORS.line; ctx.lineWidth = 1; roundRectPath(ctx, x+10, cy, iw, ih, 6); ctx.stroke();
        ctx.fillStyle = c.color; roundRectPath(ctx, x+10, cy, 5, ih, 6); ctx.fill();
        ctx.fillStyle = '#222'; ctx.fillText(fitText(nm, iw - 20), x + 24, cy + ih/2 + 4);
        cy += ih + ROW_GAP;
      });
    });

    // ===== 下方分类标题 =====
    const sectionTop = colsTop + BODY_H + SECTION_GAP;
    setFont(14,true); ctx.fillStyle = COLORS.text;
    ctx.fillText('下方分类', P, sectionTop + SECTION_TITLE_H);

    // ===== 两个分类框（等高）=====
    const boxesTop = sectionTop + SECTION_TITLE_H + 8;
    const boxX1 = P, boxX2 = P + boxW + BOX_GAP;

    // 画一个分类框的函数
    function drawBox(x, y, w, h, title, color, names){
      // 外框
      ctx.fillStyle = COLORS.card; roundRectPath(ctx, x, y, w, h, 10); ctx.fill();
      ctx.strokeStyle = COLORS.line; ctx.lineWidth = 1; roundRectPath(ctx, x, y, w, h, 10); ctx.stroke();

      // 标题 + 彩点 + 计数
      setFont(13,true); ctx.fillStyle = COLORS.text;
      ctx.fillText(title, x + BOX_PAD, y + BOX_PAD + 14);
      ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x + BOX_PAD + 58, y + BOX_PAD + 10, 4, 0, Math.PI*2); ctx.fill();
      setFont(12,false); ctx.fillStyle = '#666';
      ctx.fillText(`(${names.length})`, x + BOX_PAD + 68, y + BOX_PAD + 14);

      // 标签区域
      let cx = x + BOX_PAD, cy = y + BOX_PAD + TITLE_H + 6;
      setFont(12,false);
      names.forEach(nm=>{
        const text = String(nm||'').trim();
        const tw = Math.ceil(ctx.measureText(text).width);
        const ww = tw + TAG_PAD_X*2;
        const avail = x + w - BOX_PAD;
        if(cx + ww > avail){
          cx = x + BOX_PAD;
          cy += TAG_H + TAG_GAP;
        }
        // 背景圆角
        ctx.fillStyle = '#f5f7fb';
        roundRectPath(ctx, cx, cy, ww, TAG_H, 999);
        ctx.fill();
        ctx.strokeStyle = COLORS.line; ctx.lineWidth = 1;
        roundRectPath(ctx, cx, cy, ww, TAG_H, 999);
        ctx.stroke();
        // 文本
        ctx.fillStyle = '#222';
        ctx.fillText(text, cx + TAG_PAD_X, cy + TAG_H/2 + 4);
        cx += ww + TAG_GAP;
      });
    }

    drawBox(boxX1, boxesTop, boxW, bottomBoxesH, '弟兄姊妹', '#35c28d', members);
    drawBox(boxX2, boxesTop, boxW, bottomBoxesH, '福音朋友', '#6aa5ff', friends);

    // 页脚
    setFont(11,false); ctx.fillStyle = '#888';
    ctx.fillText('Generated by InviteManager', P, Hbase - P);

    // 下载
    if (canvas.toBlob) {
      canvas.toBlob(blob=>{
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'InviteBoard_' + new Date().toISOString().slice(0,10) + '.png';
        a.click(); URL.revokeObjectURL(url);
      }, 'image/png');
    } else {
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = 'InviteBoard_' + new Date().toISOString().slice(0,10) + '.png';
      a.click();
    }
  }catch(e){
    console.error(e);
    alert('导出失败：' + e.message);
  }
}
  window.exportBoardPNG = exportBoardPNG;

  // —— JSON 备份/恢复 & 下载本页
  function exportJSON(){
    const state = load();
    const blob = new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'invite_manager_backup.json';
    a.click(); URL.revokeObjectURL(url);
  }
  function importJSON(file){
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const obj = JSON.parse(e.target.result);
        if(!obj.people || !obj.statuses || !Array.isArray(obj.history)){
          alert('文件格式不正确'); return;
        }
        if(!obj.order) obj.order = { pool:[], yes:[], maybe:[], no:[] };
        if(!obj.bottomTypes) obj.bottomTypes = {};
        if(!obj.bottomOrder) obj.bottomOrder = { member:[], friend:[] };
        if(!obj.notes) obj.notes = {};
        if(!obj.personNotes) obj.personNotes = {};
        save(obj); render(); alert('导入成功');
      }catch(err){ alert('解析失败：' + err.message); }
    };
    reader.readAsText(file);
  }
  // —— Google Sheet 云同步
  const GOOGLE_SCRIPT_URL_KEY = 'invite_manager_google_script_url';
  const DEFAULT_GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyMFQf63WaCWHGHMFWNIwab7Qda0cGupq4Q3upB5hS3ake43Xpe3K3Wkqka2vGh6Q-gTw/exec';

  function getGoogleScriptUrl(){
    return (localStorage.getItem(GOOGLE_SCRIPT_URL_KEY) || DEFAULT_GOOGLE_SCRIPT_URL).trim();
  }

  function setSyncStatus(msg){
    const el = document.getElementById('googleSyncStatus');
    if(el) el.textContent = msg || '';
  }

  function setupGoogleSync(){
    const current = getGoogleScriptUrl();
    const url = prompt('请粘贴部署后的 Google Apps Script Web App URL：', current);
    if(url === null) return;
    const v = url.trim();
    if(!v){
      localStorage.removeItem(GOOGLE_SCRIPT_URL_KEY);
      setSyncStatus('Google 同步地址已清除');
      return;
    }
    localStorage.setItem(GOOGLE_SCRIPT_URL_KEY, v);
    setSyncStatus('Google 同步已设置');
  }

  function scheduleAutoSync(){
    clearTimeout(autoSyncTimer);
    setSyncStatus('等待自动同步…');
    autoSyncTimer = setTimeout(()=>syncToGoogleSheet(true), 700);
  }

  async function syncToGoogleSheet(silent=false){
    const url = getGoogleScriptUrl();
    if(!url){ alert('请先点击“设置 Google 同步”，粘贴 Apps Script Web App URL。'); return; }
    setSyncStatus('正在同步…');
    try{
      const state = load();
      // 兼容 Google Sheet 旧版脚本：个人备注既保存在 personNotes，
      // 也附加到每个人的 note 字段，供表格的 note 列直接读取。
      state.personNotes = state.personNotes || {};
      state.people = (state.people||[]).map(person=>({
        ...person,
        note: state.personNotes[person.id] || ''
      }));
      const fallData = getListData(state, 'fall2026');
      fallData.people = (fallData.people||[]).map(person=>({
        ...person,
        note: fallData.personNotes[person.id] || '',
        category: state.bottomTypes?.[person.id] || 'friend'
      }));
      // 同步过程只更新本地缓存，不再调用 save()，避免触发下一轮自动同步。
      localStorage.setItem(storeKey, JSON.stringify(state));

      const res = await fetch(url, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'save', state })
      });
      const data = await res.json();
      if(!data || !data.ok) throw new Error((data && data.error) || '同步失败');
      setSyncStatus('已同步 ' + new Date().toLocaleTimeString());
      localChangesPending = false;
      if(!silent) alert('已同步到 Google Sheet');
    }catch(err){
      console.error(err);
      setSyncStatus('同步失败');
      if(!silent) alert('同步失败：' + err.message + '\n\n请确认 Apps Script 已部署为 Web App，并允许访问。');
    }
  }

  async function loadFromGoogleSheet(silent=false){
    const url = getGoogleScriptUrl();
    if(!url){ alert('请先点击“设置 Google 同步”，粘贴 Apps Script Web App URL。'); return; }
    if(!silent && !confirm('从 Google Sheet 读取会覆盖当前浏览器里的实时名单。继续吗？')) return;
    if(silent && localChangesPending) return;
    setSyncStatus('正在读取…');
    try{
      const sep = url.includes('?') ? '&' : '?';
      const res = await fetch(url + sep + 'action=load&_=' + Date.now());
      const data = await res.json();
      if(!data || !data.ok) throw new Error((data && data.error) || '读取失败');
      if(!data.state) throw new Error('Google Sheet 中还没有云端数据');
      const state = data.state;
      if(!state.people || !state.statuses || !Array.isArray(state.history)) throw new Error('云端数据格式不正确');
      // 兼容表格按 people[].note 返回个人备注的格式。
      state.personNotes = state.personNotes || {};
      state.people.forEach(person=>{
        if(person && person.id && typeof person.note === 'string'){
          state.personNotes[person.id] = person.note;
        }
      });
      const fallData = getListData(state, 'fall2026');
      fallData.people.forEach(person=>{
        if(person && person.id && typeof person.note === 'string'){
          fallData.personNotes[person.id] = person.note;
        }
      });
      localStorage.setItem(storeKey, JSON.stringify(state));
      render();
      setSyncStatus('已读取 ' + new Date().toLocaleTimeString());
      if(!silent) alert('已从 Google Sheet 读取');
    }catch(err){
      console.error(err);
      setSyncStatus('读取失败');
      if(!silent) alert('读取失败：' + err.message);
    }
  }

  async function startAutomaticGoogleSync(){
    setSyncStatus('正在读取云端数据…');
    await loadFromGoogleSheet(true);
    autoSyncEnabled = true;
  }

  // —— 事件绑定
  $('#addBtn').addEventListener('click', ()=>{
    const v = $('#newName').value.trim();
    const allowDup = $('#allowDup') ? $('#allowDup').checked : false;
    addPerson(v, allowDup);
    $('#newName').value='';
  });
  $('#newName').addEventListener('keypress', (e)=>{ if(e.key==='Enter') $('#addBtn').click(); });
  $('#toggleBulkBtn').addEventListener('click', ()=>{
    const box = $('#bulkBox');
    box.style.display = (box.style.display==='none' || !box.style.display) ? 'block' : 'none';
  });
  $('#bulkAddBtn').addEventListener('click', ()=>{ bulkAdd($('#bulkInput').value, $('#allowDup').checked); $('#bulkInput').value=''; });
  $('#exportBtn').addEventListener('click', exportJSON);
  $('#importBtn').addEventListener('click', ()=> $('#importFile').click());
  $('#importFile').addEventListener('change', (e)=>{ const f=e.target.files[0]; if(f) importJSON(f); e.target.value=''; });
  document.getElementById('pngBtn')?.addEventListener('click', exportBoardPNG);
  document.getElementById('googleSetupBtn')?.addEventListener('click', setupGoogleSync);
  document.getElementById('googleSaveBtn')?.addEventListener('click', ()=>syncToGoogleSheet(false));
  document.getElementById('googleLoadBtn')?.addEventListener('click', ()=>loadFromGoogleSheet(false));
  $$('.view-tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      const view = tab.dataset.viewTarget || 'board';
      activeListKey = view === 'fall2026' ? 'fall2026' : 'main';
      $('.workspace-layout').dataset.view = view;
      const titles = {
        board: ['跟进中心', '拖动姓名更新进度，点击详情查看个人备注。'],
        categories: ['分组整理', '在弟兄姊妹与福音朋友之间拖动姓名。'],
        fall2026: ['2026 Fall 开学季', '独立的开学季福音名单，初始为空。'],
        notice: ['Notice', '发布聚会安排、代祷和服事提醒。']
      };
      $('#workspaceTitle').textContent = titles[view][0];
      $('#workspaceDescription').textContent = titles[view][1];
      $('#newName').placeholder = view === 'fall2026' ? '添加到开学季…' : '输入姓名…';
      $$('.view-tab').forEach(btn=>{
        const active = btn === tab;
        btn.classList.toggle('active', active);
        btn.setAttribute('aria-selected', active ? 'true' : 'false');
      });
      render();
    });
  });
  $('#noticeAddBtn').addEventListener('click', addNotice);
  $('#noticeInput').addEventListener('keydown', e=>{
    if((e.metaKey || e.ctrlKey) && e.key === 'Enter') addNotice();
  });
  $('#cancelPersonNoteBtn').addEventListener('click', ()=>{
    editingPersonNoteId = null;
    $('#personNoteDialog').close();
  });
  $('#deletePersonBtn').addEventListener('click', ()=>{
    if(!editingPersonNoteId) return;
    const state = load();
    const person = (getListData(state).people||[]).find(p=>p.id === editingPersonNoteId);
    if(!confirm(`确定删除“${person?.name || '该对象'}”？`)) return;
    const id = editingPersonNoteId;
    editingPersonNoteId = null;
    $('#personNoteDialog').close();
    deletePerson(id);
    render();
  });
  $('#personNoteDialog').addEventListener('close', ()=>{
    if($('#personNoteDialog').returnValue !== 'save' || !editingPersonNoteId){
      editingPersonNoteId = null;
      return;
    }
    const state = load();
    const data = getListData(state);
    const person = (data.people||[]).find(p=>p.id === editingPersonNoteId);
    const name = normalizedName($('#personNameInput').value);
    if(person && name) person.name = name;
    data.personNotes = data.personNotes || {};
    const note = $('#personNoteInput').value.trim();
    if(note) data.personNotes[editingPersonNoteId] = note;
    else delete data.personNotes[editingPersonNoteId];
    editingPersonNoteId = null;
    save(state);
    render();
  });

  // —— 初始化
  render();
  startAutomaticGoogleSync();
})();
</script>
</body>
</html>
