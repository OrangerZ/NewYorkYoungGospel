<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大纽约青年福音朋友</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji"; margin: 0; background: #f7f7f8;}
  header { background: linear-gradient(135deg,#111 0%, #1f1f23 60%, #2d2d34 100%); color: #fff; padding: 14px 18px; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  header h1 { margin: 0; font-size: 20px; }
  main { padding: 16px; max-width: 1100px; margin: 0 auto;}
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px;}
  .toolbar input[type="text"]{ padding: 8px 10px; border: 1px solid #ccc; border-radius: 10px; outline: none; }
  .toolbar button { padding: 8px 12px; border: 1px solid #ccc; background: #fff; border-radius: 10px; cursor: pointer; transition: transform .12s ease, box-shadow .12s ease, background .12s ease;}
  .toolbar button:hover { background: #f0f0f0; transform: translateY(-1px); box-shadow: 0 6px 14px rgba(0,0,0,.06); }
  .columns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .col { background: #fff; border: 1px solid #e6e6e6; border-radius: 12px; min-height: 320px; display: flex; flex-direction: column; box-shadow: 0 4px 18px rgba(0,0,0,.04); transition: box-shadow .15s ease, transform .12s ease; }
  .col:hover{ box-shadow: 0 8px 26px rgba(0,0,0,.06); transform: translateY(-1px); }
  .col h3 { margin: 0; padding: 10px 12px; border-bottom: 2px solid #eee; font-size: 15px; display: flex; justify-content: space-between; align-items: center;}
  .count { font-weight: 600; color: #555; font-size: 13px; padding: 2px 8px; border-radius: 999px; background:#f3f4f6; border:1px solid #e9e9ee; }
  .list { flex: 1; padding: 10px; display: grid; grid-auto-rows: min-content; gap: 8px; }
  .item { background: #fafafa; border: 1px solid #e9e9e9; border-radius: 12px; padding: 8px 10px; cursor: grab; user-select: none; display: flex; justify-content: space-between; align-items: center; position: relative; transition: transform .12s ease, box-shadow .12s ease, background .12s ease; }
  .item:hover{ transform: translateY(-1px); box-shadow: 0 6px 14px rgba(0,0,0,.06); background:#fff; }
  .item.dragging { opacity: 0.6; transform: rotate(-1deg) scale(.98); }
  .drop-hint{ outline: 2px dashed #bbb; outline-offset: -6px; }
  .item .name { font-weight: 600; }
  .chip.has-note::after{ content:" •"; color:#6366f1; }
  .item .actions { display: flex; gap: 6px; }
  .chip { font-size: 11px; padding: 2px 6px; border-radius: 6px; border: 1px solid #ddd; background: #fff; cursor: pointer; }
  .chip.icon-btn{ width:24px; height:24px; padding:4px; display:inline-flex; align-items:center; justify-content:center; }
  .chip.icon-btn svg{ width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .chip.icon-btn:hover{ background:#f3f4f6; }
  .empty { color: #999; font-size: 13px; text-align: center; padding: 12px;}
  .small { font-size: 12px; color: #666; }
  footer { padding: 12px 16px; color: #888; font-size: 12px; text-align: center;}
  .bulk { display:none; background: #fff; border: 1px dashed #ccc; border-radius: 10px; padding: 10px; margin-bottom: 12px;}
  .bulk textarea { width: 100%; min-height: 120px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
  .muted { color: #777; font-size: 12px; }

  /* 列标题彩条 */
  :root{ --pool:#6aa5ff; --yes:#35c28d; --maybe:#f7b84b; --no:#ef5b6b; }
  .col[data-status="pool"] h3{ border-bottom-color: var(--pool); }
  .col[data-status="yes"] h3{ border-bottom-color: var(--yes); }
  .col[data-status="maybe"] h3{ border-bottom-color: var(--maybe); }
  .col[data-status="no"] h3{ border-bottom-color: var(--no); }
  #list-pool  .item::before{ background: var(--pool); }
  #list-yes   .item::before{ background: var(--yes); }
  #list-maybe .item::before{ background: var(--maybe); }
  #list-no    .item::before{ background: var(--no); }
  .item::before{ content:""; position:absolute; left:-1px; top:-1px; bottom:-1px; width:6px; border-radius:12px 0 0 12px; opacity:.6; }

  /* 历史面板 */
  .history-panel{
    background:#fff; border:1px solid #e6e6e6; border-radius:12px; padding:12px; margin-top:14px;
    box-shadow: 0 4px 18px rgba(0,0,0,.04);
  }

  /* 下方分类（弟兄姊妹 / 福音朋友） */
  .bottom-panel{
    background:#fff; border:1px solid #e6e6e6; border-radius:12px; padding:12px; margin-top:14px;
    box-shadow: 0 4px 18px rgba(0,0,0,.04);
  }
  .bottom-rows{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  .bcol{ border: 1px dashed #e0e0e0; border-radius:10px; padding:10px; min-height:84px; }
  .bcol h4{ margin:0 0 8px 0; font-size:14px; display:flex; align-items:center; gap:8px;}
  .bcount{ font-size:12px; color:#666;}
  .blist{ display:flex; flex-wrap:wrap; gap:8px; min-height: 40px; }
  .btag{ font-size:12px; line-height:1; padding:6px 8px; border-radius:999px; background:#f5f7fb; border:1px solid #e6e6e6; user-select:none; cursor:grab; }
  .btag.dragging{ opacity:.6; transform: scale(.98); }
  .blist.drop-hint{ outline:2px dashed #c7d2fe; outline-offset:-6px; }
  .bcol[data-bcat="member"] .btag{ background:#eefbf5; border-color:#d7f3e6; }
  .bcol[data-bcat="friend"] .btag{ background:#f7f7ff; border-color:#e4e6ff; }

  /* 个人备注窗口 */
  .note-dialog{ width:min(440px, calc(100% - 32px)); padding:0; border:0; border-radius:14px; box-shadow:0 24px 70px rgba(0,0,0,.25); }
  .note-dialog::backdrop{ background:rgba(17,24,39,.45); }
  .note-dialog form{ padding:18px; }
  .note-dialog h2{ margin:0 0 6px; font-size:18px; }
  .note-dialog .dialog-hint{ margin:0 0 12px; color:#777; font-size:12px; }
  .note-dialog label{ display:block; margin:10px 0 5px; color:#555; font-size:13px; font-weight:600; }
  #personNameInput, #personNoteInput{ width:100%; padding:10px; border:1px solid #ccc; border-radius:10px; font:inherit; outline:none; }
  #personNoteInput{ min-height:150px; resize:vertical; }
  #personNameInput:focus, #personNoteInput:focus{ border-color:#818cf8; box-shadow:0 0 0 3px rgba(99,102,241,.14); }
  #personNameInput[readonly], #personNoteInput[readonly]{ color:#444; background:#f7f7f8; cursor:default; }
  .dialog-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:12px; }
  .dialog-actions button{ padding:8px 14px; border:1px solid #d1d5db; border-radius:9px; background:#fff; cursor:pointer; }
  .dialog-actions .primary{ color:#fff; background:#4f46e5; border-color:#4f46e5; }
  .dialog-actions .danger{ color:#dc2626; border-color:#fecaca; margin-right:auto; }
  .dialog-actions .danger:hover{ background:#fef2f2; }

  @media (max-width: 900px){ .columns { grid-template-columns: repeat(2, 1fr);} }
  @media (max-width: 560px){ .columns { grid-template-columns: 1fr;} }
  @media (max-width: 720px){ .bottom-rows{ grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>大纽约青年福音朋友</h1>
</header>
<main>
  <div class="toolbar">
    <input id="newName" type="text" placeholder="添加人员姓名…">
    <button id="addBtn">添加人员</button>
    <button id="toggleBulkBtn">批量添加</button>
    <button id="exportBtn">导出JSON</button>
    <input id="importFile" type="file" accept=".json" style="display:none">
    <button id="importBtn">导入JSON</button>
    <button id="pngBtn">导出看板PNG</button>
    <button id="googleSetupBtn">设置 Google 同步</button>
    <button id="googleSaveBtn">同步到 Google Sheet</button>
    <button id="googleLoadBtn">从 Google Sheet 读取</button>
    <span id="googleSyncStatus" class="small"></span>
  </div>

  <div id="bulkBox" class="bulk">
    <div style="display:flex; gap:8px; align-items:center; margin-bottom:6px;">
      <strong>批量添加</strong>
      <span class="muted">支持换行、逗号、顿号、分号分隔；默认去重（不区分大小写，忽略空格）。</span>
    </div>
    <textarea id="bulkInput" placeholder="示例：
张三
李四, 王五；赵六、钱七
..."></textarea>
    <div style="margin-top:8px; display:flex; gap:8px; align-items:center;">
      <button id="bulkAddBtn">添加到邀请</button>
      <label class="small"><input id="allowDup" type="checkbox"> 允许重名（默认去重）</label>
    </div>
  </div>

  <div class="columns">
    <section class="col" data-status="pool">
      <h3>邀请 <span class="count" id="count-pool">0</span></h3>
      <div class="list" id="list-pool"></div>
    </section>
    <section class="col" data-status="yes">
      <h3>确定 <span class="count" id="count-yes">0</span></h3>
      <div class="list" id="list-yes"></div>
    </section>
    <section class="col" data-status="maybe">
      <h3>待定 <span class="count" id="count-maybe">0</span></h3>
      <div class="list" id="list-maybe"></div>
    </section>
    <section class="col" data-status="no">
      <h3>不来 <span class="count" id="count-no">0</span></h3>
      <div class="list" id="list-no"></div>
    </section>
  </div>

  <section class="bottom-panel">
    <h3 style="margin:0 0 8px 0; font-size:15px;">下方分类（与上方名单同步，可拖拽排序并记住顺序）</h3>
    <div class="bottom-rows">
      <div class="bcol" data-bcat="member">
        <h4>弟兄姊妹 <span class="bcount" id="bcount-member">0</span></h4>
        <div class="blist" id="list-member"></div>
      </div>
      <div class="bcol" data-bcat="friend">
        <h4>福音朋友 <span class="bcount" id="bcount-friend">0</span></h4>
        <div class="blist" id="list-friend"></div>
      </div>
    </div>
    <p class="small" style="margin-top:6px;color:#666;">说明：新增默认进入「福音朋友」。下方用于分类与排序，不能重命名/删除；上方的改名/删除会同步这里；可在两框之间拖动并持久化顺序。</p>
  </section>

</main>
<dialog id="personNoteDialog" class="note-dialog">
  <form method="dialog">
    <h2 id="personNoteTitle">人员详情</h2>
    <p id="personNoteHint" class="dialog-hint">查看该人员的信息。</p>
    <label for="personNameInput">姓名</label>
    <input id="personNameInput" type="text">
    <label for="personNoteInput">备注</label>
    <textarea id="personNoteInput" placeholder="记录联系方式、邀请进度或其他信息…"></textarea>
    <div class="dialog-actions">
      <button type="button" id="deletePersonBtn" class="danger">删除人员</button>
      <button type="button" id="cancelPersonNoteBtn">关闭</button>
      <button type="submit" id="savePersonNoteBtn" class="primary" value="save">保存</button>
    </div>
  </form>
</dialog>
<footer>数据同步保存到 <a href="https://docs.google.com/spreadsheets/d/15uMfJDmleLfw2-2PaLVU_8a-zSGn7-T8qbXu_082VXs/edit?usp=sharing" target="_blank" rel="noopener noreferrer">Google Sheet</a>。</footer>

<script>
(function(){
  const $  = (sel)=>document.querySelector(sel);
  const $$ = (sel)=>Array.from(document.querySelectorAll(sel));
  const storeKey = 'invite_manager_v2';

  const STATUS_LABEL = { pool:"邀请", yes:"确定", maybe:"待定", no:"不来" };

  // —— 下方分类映射：id -> 'member' | 'friend'
  function ensureBottomTypes(state){
    if(!state.bottomTypes) state.bottomTypes = {};
    const valid = new Set((state.people||[]).map(p=>p.id));
    Object.keys(state.bottomTypes).forEach(id=>{ if(!valid.has(id)) delete state.bottomTypes[id]; });
    (state.people||[]).forEach(p=>{ if(!state.bottomTypes[p.id]) state.bottomTypes[p.id] = 'friend'; });
  }

  // —— 载入（带自修复：四列顺序 + 底部分类/顺序）
  function load(){
    const raw = localStorage.getItem(storeKey);
    if(!raw){
      const init = {
        people: [], statuses: {}, history: [],
        order: { pool:[], yes:[], maybe:[], no:[] },
        bottomTypes: {},
        bottomOrder: { member:[], friend:[] },
        personNotes: {} // personId -> note 文本
      };
      localStorage.setItem(storeKey, JSON.stringify(init));
      return init;
    }
    let state; try{ state = JSON.parse(raw); }catch{ state = {}; }

    if(!state.people)   state.people   = [];
    if(!state.statuses) state.statuses = {};
    if(!state.history)  state.history  = [];
    if(!state.order)    state.order    = { pool:[], yes:[], maybe:[], no:[] };
    if(!state.bottomTypes)  state.bottomTypes  = {};
    if(!state.bottomOrder)  state.bottomOrder  = { member:[], friend:[] };
    if(!state.personNotes) state.personNotes = {};

    ensureBottomTypes(state);

    // 顶部四列顺序自修复
    const validIds = new Set(state.people.map(p=>p.id));
    const bySt = { pool:[], yes:[], maybe:[], no:[] };
    state.people.forEach(p=>{
      const st = state.statuses[p.id] || 'pool';
      bySt[st].push(p.id);
    });
    ['pool','yes','maybe','no'].forEach(st=>{
      state.order[st] = (state.order[st]||[]).filter(id => validIds.has(id) && bySt[st].includes(id));
      bySt[st].forEach(id=>{ if(!state.order[st].includes(id)) state.order[st].push(id); });
    });

    // 底部顺序自修复
    ['member','friend'].forEach(k=>{
      state.bottomOrder[k] = (state.bottomOrder[k]||[]).filter(id=>validIds.has(id));
    });
    state.people.forEach(p=>{
      const cat = state.bottomTypes[p.id] || 'friend';
      const arr = state.bottomOrder[cat];
      if(!arr.includes(p.id)) arr.push(p.id);
    });

    return state;
  }
  let autoSyncEnabled = false;
  let autoSyncTimer = null;
  let localChangesPending = false;

  function save(state){
    localStorage.setItem(storeKey, JSON.stringify(state));
    if(autoSyncEnabled){
      localChangesPending = true;
      scheduleAutoSync();
    }
  }

  function normalizedName(name){ return (name||'').trim().replace(/\s+/g,' '); }
  function existsByName(state, name){
    const target = name.toLowerCase();
    return state.people.some(p => (p.name||'').trim().toLowerCase() === target);
  }

  function addPerson(name, allowDup=false){
    const state = load();
    const nm = normalizedName(name);
    if(!nm) return;
    if(!allowDup && existsByName(state, nm)) return;
    const id = 'p_' + Math.random().toString(36).slice(2,10);
    state.people.push({id, name: nm});
    state.statuses[id] = 'pool';

    // 顶部顺序：加入“邀请”末尾
    if(!state.order) state.order = { pool:[], yes:[], maybe:[], no:[] };
    state.order.pool.push(id);

    // 下方分类与顺序
    ensureBottomTypes(state);
    state.bottomTypes[id] = 'friend';
    if(!state.bottomOrder) state.bottomOrder = { member:[], friend:[] };
    state.bottomOrder.friend.push(id);

    save(state); render();
  }

  function bulkAdd(text, allowDup=false){
    const sep = /[,\n\r;、，；]+/;
    const parts = (text||'').split(sep).map(s => normalizedName(s)).filter(Boolean);
    const state = load();
    parts.forEach(nm=>{
      if(!allowDup && existsByName(state, nm)) return;
      const id = 'p_' + Math.random().toString(36).slice(2,10);
      state.people.push({id, name: nm});
      state.statuses[id] = 'pool';
      if(!state.order) state.order = { pool:[], yes:[], maybe:[], no:[] };
      state.order.pool.push(id);
      ensureBottomTypes(state);
      if(!state.bottomOrder) state.bottomOrder = { member:[], friend:[] };
      state.bottomTypes[id] = 'friend';
      state.bottomOrder.friend.push(id);
    });
    save(state); render();
  }

  function setStatus(id, status){
    const state = load();
    state.statuses[id] = status;
    save(state);
    render();
  }

  // —— 渲染
  function render(){
    const state = load();
    const lists = { pool: $('#list-pool'), yes: $('#list-yes'), maybe: $('#list-maybe'), no: $('#list-no') };
    Object.values(lists).forEach(ul => ul.innerHTML='');

    const id2p = {}; (state.people||[]).forEach(p=> id2p[p.id]=p);

    ['pool','yes','maybe','no'].forEach(st=>{
      const ul = lists[st];
      let ids = (state.order && state.order[st]) ? state.order[st].slice() : [];
      if(!ids || ids.length === 0){
        ids = (state.people||[])
          .filter(p => (state.statuses[p.id] || 'pool') === st)
          .map(p => p.id);
      }
      let has = false;
      ids.forEach(id=>{
        const p = id2p[id];
        if(!p) return;
        const cur = state.statuses[p.id] || 'pool';
        if(cur !== st) return;
        const el = document.createElement('div');
        el.className = 'item'; el.draggable = true; el.dataset.id = p.id;
        el.innerHTML = `
          <span class="name">${escapeHTML(p.name)}</span>
          <span class="actions">
            <button class="chip${(state.personNotes[p.id]||'').trim() ? ' has-note' : ''}" data-action="details">详情</button>
            <button class="chip icon-btn" data-action="rename" title="编辑姓名和备注" aria-label="编辑姓名和备注">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>
            </button>
          </span>`;
        ul.appendChild(el); has = true;
      });
      if(!has) ul.innerHTML = '<div class="empty">暂无人员，请先添加。</div>';
    });

    enableDnDSortable();     // 顶部四列：可插队拖拽 + 跨列
    enableItemActions();
    renderCounts();
    renderBottomPanel();

  }

  function renderCounts(){
    const state = load();
    const counts = { pool:0, yes:0, no:0, maybe:0 };
    state.people.forEach(p => { counts[state.statuses[p.id] || 'pool']++; });
    $('#count-pool').textContent = counts.pool;
    $('#count-yes').textContent = counts.yes;
    $('#count-no').textContent = counts.no;
    $('#count-maybe').textContent = counts.maybe;
  }

  // —— 下方分类（按 bottomOrder 渲染 + 兜底）
  function renderBottomPanel(){
    const state = load();
    ensureBottomTypes(state);
    if(!state.bottomOrder) state.bottomOrder = { member: [], friend: [] };

    const memberList = document.getElementById('list-member');
    const friendList = document.getElementById('list-friend');
    memberList.innerHTML = ''; friendList.innerHTML = '';

    const id2p = {}; (state.people||[]).forEach(p=> id2p[p.id]=p);

    let memberIds = (state.bottomOrder.member||[]).slice();
    let friendIds = (state.bottomOrder.friend||[]).slice();

    (state.people||[]).forEach(p=>{
      const cat = state.bottomTypes[p.id] || 'friend';
      if(cat === 'member'){
        if(!memberIds.includes(p.id)) memberIds.push(p.id);
      }else{
        if(!friendIds.includes(p.id)) friendIds.push(p.id);
      }
    });

    let memberCnt=0, friendCnt=0;
    memberIds.forEach(id=>{
      const p = id2p[id]; if(!p) return;
      const tag = document.createElement('div');
      tag.className = 'btag'; tag.draggable = true; tag.dataset.id = id;
      tag.textContent = p.name || '';
      memberList.appendChild(tag); memberCnt++;
    });
    friendIds.forEach(id=>{
      const p = id2p[id]; if(!p) return;
      const tag = document.createElement('div');
      tag.className = 'btag'; tag.draggable = true; tag.dataset.id = id;
      tag.textContent = p.name || '';
      friendList.appendChild(tag); friendCnt++;
    });

    document.getElementById('bcount-member').textContent = memberCnt;
    document.getElementById('bcount-friend').textContent = friendCnt;

    enableBottomDnDSortable();
  }

  // —— 顶部四列拖拽：列内排序 + 跨列移动 + 持久化
  function enableDnDSortable(){
    const cols = $$('.col .list');
    let draggingEl = null;

    function getAfterElement(container, y){
      const els = [...container.querySelectorAll('.item:not(.dragging)')];
      let closest = {offset: Number.NEGATIVE_INFINITY, el: null};
      els.forEach(el=>{
        const box = el.getBoundingClientRect();
        const offset = y - (box.top + box.height/2);
        if(offset < 0 && offset > closest.offset){
          closest = {offset, el};
        }
      });
      return closest.el;
    }

    $$('.item').forEach(el=>{
      el.addEventListener('dragstart', e=>{
        draggingEl = el;
        el.classList.add('dragging');
        try{ e.dataTransfer.setData('text/plain', el.dataset.id); e.dataTransfer.effectAllowed='move'; }catch(_){}
      });
      el.addEventListener('dragend', ()=>{
        el.classList.remove('dragging');
        draggingEl = null;
        persistCurrentOrder();
      });
    });

    cols.forEach(list=>{
      list.addEventListener('dragover', e=>{
        e.preventDefault();
        const after = getAfterElement(list, e.clientY);
        if(!draggingEl) return;
        if(after == null) list.appendChild(draggingEl);
        else list.insertBefore(draggingEl, after);
      });

      list.addEventListener('drop', e=>{
        e.preventDefault();
        const id = (e.dataTransfer && e.dataTransfer.getData('text/plain')) || (draggingEl && draggingEl.dataset.id);
        const status = list.parentElement.dataset.status; // pool/yes/maybe/no
        if(!id || !status) return;

        const state = load();
        if(!state.order) state.order = { pool:[], yes:[], maybe:[], no:[] };

        state.statuses[id] = status;
        ['pool','yes','maybe','no'].forEach(st=>{
          state.order[st] = (state.order[st]||[]).filter(x=>x!==id);
        });

        const ids = [...list.querySelectorAll('.item')].map(x=>x.dataset.id);
        state.order[status] = ids;

        save(state);
        render();
      });
    });

    function persistCurrentOrder(){
      const state = load();
      ['pool','yes','maybe','no'].forEach(st=>{
        const list = document.querySelector(`.col[data-status="${st}"] .list`);
        if(!list) return;

  // —— 下方分类拖拽：列内排序 + 跨列移动 + 持久化
  function enableBottomDnDSortable(){
    const memberList = document.getElementById('list-member');
    const friendList = document.getElementById('list-friend');
    const lists = [memberList, friendList];
    let draggingEl = null;

    function getAfterElement(container, y){
      const els = [...container.querySelectorAll('.btag:not(.dragging)')];
      let closest = {offset: Number.NEGATIVE_INFINITY, el: null};
      els.forEach(el=>{
        const box = el.getBoundingClientRect();
        const offset = y - (box.top + box.height/2);
        if(offset < 0 && offset > closest.offset){
          closest = {offset, el};
        }
      });
      return closest.el;
    }

    lists.forEach(list=>{
      [...list.querySelectorAll('.btag')].forEach(el=>{
        el.addEventListener('dragstart', e=>{
          draggingEl = el;
          el.classList.add('dragging');
          try{ e.dataTransfer.setData('text/plain', el.dataset.id); e.dataTransfer.effectAllowed='move'; }catch(_){}
        });
        el.addEventListener('dragend', ()=>{
          el.classList.remove('dragging');
          draggingEl = null;
          persistBottomOrder();
        });
      });
    });

    lists.forEach(list=>{
      list.addEventListener('dragover', e=>{
        e.preventDefault();
        const after = getAfterElement(list, e.clientY);
        if(!draggingEl) return;
        if(after == null) list.appendChild(draggingEl);
        else list.insertBefore(draggingEl, after);
        list.classList.add('drop-hint');
      });
      list.addEventListener('dragleave', e=>{
        if(!list.contains(e.relatedTarget)) list.classList.remove('drop-hint');
      });
      list.addEventListener('drop', e=>{
        e.preventDefault();
        list.classList.remove('drop-hint');

        const id = (e.dataTransfer && e.dataTransfer.getData('text/plain')) || (draggingEl && draggingEl.dataset.id);
        if(!id) return;

        const state = load();
        if(!state.bottomTypes) state.bottomTypes = {};
        if(!state.bottomOrder) state.bottomOrder = { member:[], friend:[] };

        const targetCat = (list.id === 'list-member') ? 'member' : 'friend';
        state.bottomTypes[id] = targetCat;

        ['member','friend'].forEach(k=>{
          state.bottomOrder[k] = (state.bottomOrder[k]||[]).filter(x=>x!==id);
        });

        const ids = [...list.querySelectorAll('.btag')].map(x=>x.dataset.id);
        state.bottomOrder[targetCat] = ids;

        save(state);
        document.getElementById('bcount-member').textContent = memberList.querySelectorAll('.btag').length;
        document.getElementById('bcount-friend').textContent = friendList.querySelectorAll('.btag').length;
      });
    });

    function persistBottomOrder(){
      const state = load();
      if(!state.bottomOrder) state.bottomOrder = { member:[], friend:[] };
      state.bottomOrder.member = [...memberList.querySelectorAll('.btag')].map(x=>x.dataset.id);
      state.bottomOrder.friend = [...friendList.querySelectorAll('.btag')].map(x=>x.dataset.id);
      save(state);
    }
  }

  // —— PNG 导出（含下方分类区）
function exportBoardPNG(){
  try{
    // ===== 基本配置（导出更清晰）=====
    const scale   = 2;
    const baseW   = 700;    // 画布逻辑宽度
    const COL_W   = 160;    // 上方单列宽
    const COL_GAP = 12;
    const P       = 24;     // 外边距
    const HEADER_H= 52;     // 顶部标题/日期区
    const ROW_H   = 28;     // 上方姓名卡片高度
    const ROW_GAP = 6;
    const FOOTER_H= 24;

    // —— 分类区尺寸
    const SECTION_GAP = 16; // 四列与分类区之间的间距
    const BOX_GAP     = 12; // 两个分类框之间的水平间距
    const BOX_PAD     = 10; // 分类框内边距
    const TAG_H       = 20; // 分类区姓名标签高度
    const TAG_GAP     = 6;  // 标签之间的间距
    const TAG_PAD_X   = 10; // 标签左右内边距
    const TITLE_H     = 22; // 每个分类框标题高度
    const SECTION_TITLE_H = 20; // “下方分类”标题高度

    // ===== 取当前页面数据 =====
    const state   = load();
    let people  = state.people || [];
    let statuses= state.statuses || {};

    // 上方四列分桶
    const buckets = { pool:[], yes:[], maybe:[], no:[] };
    people.forEach(p=>{
      const st = statuses[p.id] || 'pool';
      (buckets[st]||buckets.pool).push(p.name || '');
    });

    // —— 下方分类的数据（用当前页面的分类与顺序）
    const id2name = {}; (people||[]).forEach(p=> id2name[p.id] = p.name || '');
    const bottomTypes = state.bottomTypes || {};
    const bottomOrder = state.bottomOrder || {member:[], friend:[]};

    function collectBottom(cat){
      const ordered = (bottomOrder[cat]||[]).filter(id=>id2name[id]).map(id=>id2name[id]);
      // 把顺序里没有但类型属于该类的也补上
      const extra = [];
      Object.keys(bottomTypes).forEach(id=>{
        if(bottomTypes[id] === cat && id2name[id] && !ordered.includes(id2name[id])){
          extra.push(id2name[id]);
        }
      });
      return ordered.concat(extra);
    }
    const members = collectBottom('member');
    const friends = collectBottom('friend');

    // ===== 先预计算高度（需要测量文本宽度）=====
    // 用一个临时 ctx 来测量标签宽度，决定行数/高度
    const tempCanvas = document.createElement('canvas');
    const tctx = tempCanvas.getContext('2d');
    function setMeasureFont(px,bold=false){
      tctx.font = `${bold?'600 ':''}${px}px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"PingFang SC","Microsoft YaHei"`;
    }
    setMeasureFont(12,false);

    const colsMaxRows = Math.max(
      buckets.pool.length, buckets.yes.length, buckets.maybe.length, buckets.no.length, 1
    );
    const BODY_H  = 40 + (ROW_H + ROW_GAP) * colsMaxRows; // 上方四列高度（卡片区）
    const topPartH = P + HEADER_H + BODY_H;               // 上方总高（不含页脚）

    // 分类框宽度（两列）
    const totalW  = baseW - P*2;
    const boxW    = (totalW - BOX_GAP) / 2;

    function measureBoxHeight(names){
      let x = 0, rows = 0;
      names.forEach(n=>{
        const text = String(n||'').trim();
        const w = Math.ceil(tctx.measureText(text).width) + TAG_PAD_X*2;
        if(x === 0){ // 行首
          x = w; rows = 1;
        }else{
          if(x + TAG_GAP + w <= boxW - BOX_PAD*2){
            x += TAG_GAP + w;
          }else{
            rows += 1; x = w;
          }
        }
      });
      if(rows === 0) rows = 1; // 最少一行
      // 盒子高度 = 顶部标题 + 间距 + rows 行标签 + 内边距
      return BOX_PAD + TITLE_H + 6 + rows*TAG_H + (rows-1)*TAG_GAP + BOX_PAD;
    }
    const memberBoxH = measureBoxHeight(members);
    const friendBoxH = measureBoxHeight(friends);
    const bottomBoxesH = Math.max(memberBoxH, friendBoxH);
    const bottomSectionH = SECTION_GAP + SECTION_TITLE_H + 8 + bottomBoxesH; // 包含“下方分类”标题

    // 总高度
    const Hbase = topPartH + bottomSectionH + FOOTER_H + P;

    // ===== 正式画布 =====
    const W = baseW * scale, H = Hbase * scale;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);

    // 颜色
    const COLORS = {
      bg:'#f7f7f8', card:'#fff', text:'#111', line:'#e6e6e6',
      pool:'#6aa5ff', yes:'#35c28d', maybe:'#f7b84b', no:'#ef5b6b'
    };

    function setFont(px,bold=false){
      ctx.font = `${bold?'600 ':''}${px}px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"PingFang SC","Microsoft YaHei"`;
    }
    function roundRectPath(ctx, x, y, w, h, r){
      const rr = Math.max(0, Math.min(r || 8, w/2, h/2));
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.lineTo(x + w - rr, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
      ctx.lineTo(x + w, y + h - rr);
      ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
      ctx.lineTo(x + rr, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
      ctx.lineTo(x, y + rr);
      ctx.quadraticCurveTo(x, y, x + rr, y);
      ctx.closePath();
    }
    function fitText(t,maxW){
      let s = String(t || '');
      while (ctx.measureText(s).width > maxW) {
        if (s.length <= 1) break;
        s = s.slice(0,-1);
      }
      return s !== t ? s + '…' : s;
    }

    // 背景
    ctx.fillStyle = COLORS.bg; ctx.fillRect(0,0,baseW,Hbase);

    // 顶部：标题/顾问
    const topY = P;

    setFont(22,true); ctx.fillStyle = COLORS.text; ctx.textAlign = 'center';
    ctx.fillText('主日下午LIC聚会邀请', baseW/2, topY + 24);

    ctx.textAlign = 'right'; setFont(15,true);
    ctx.fillText('顾问：饶铭杰', baseW - P, topY + 24);
    ctx.textAlign = 'left';

    // 上方四列
    const cols = [
      {key:'pool',  title:'邀请', color:COLORS.pool},
      {key:'yes',   title:'确定', color:COLORS.yes},
      {key:'maybe', title:'待定', color:COLORS.maybe},
      {key:'no',    title:'不来', color:COLORS.no}
    ];
    const totalColsW  = 4*COL_W + 3*COL_GAP;
    const leftPad = (baseW - totalColsW) / 2;
    const colsTop = topY + HEADER_H;

    cols.forEach((c,idx)=>{
      const x = leftPad + idx*(COL_W + COL_GAP);
      const y = colsTop;

      ctx.fillStyle = COLORS.card; roundRectPath(ctx, x, y, COL_W, BODY_H, 10); ctx.fill();
      ctx.strokeStyle = COLORS.line; ctx.lineWidth = 1; roundRectPath(ctx, x, y, COL_W, BODY_H, 10); ctx.stroke();

      setFont(14,true); ctx.fillStyle = COLORS.text;
      ctx.fillText(c.title, x + 10, y + 22);
      ctx.fillStyle = c.color; ctx.beginPath(); ctx.arc(x + COL_W - 14, y + 16, 5, 0, Math.PI*2); ctx.fill();

      setFont(12,false);
      let cy = y + 36;
      (buckets[c.key] || []).forEach(nm=>{
        const iw = COL_W - 20, ih = ROW_H;
        ctx.fillStyle = '#fafafa'; roundRectPath(ctx, x+10, cy, iw, ih, 6); ctx.fill();
        ctx.strokeStyle = COLORS.line; ctx.lineWidth = 1; roundRectPath(ctx, x+10, cy, iw, ih, 6); ctx.stroke();
        ctx.fillStyle = c.color; roundRectPath(ctx, x+10, cy, 5, ih, 6); ctx.fill();
        ctx.fillStyle = '#222'; ctx.fillText(fitText(nm, iw - 20), x + 24, cy + ih/2 + 4);
        cy += ih + ROW_GAP;
      });
    });

    // ===== 下方分类标题 =====
    const sectionTop = colsTop + BODY_H + SECTION_GAP;
    setFont(14,true); ctx.fillStyle = COLORS.text;
    ctx.fillText('下方分类', P, sectionTop + SECTION_TITLE_H);

    // ===== 两个分类框（等高）=====
    const boxesTop = sectionTop + SECTION_TITLE_H + 8;
    const boxX1 = P, boxX2 = P + boxW + BOX_GAP;

    // 画一个分类框的函数
    function drawBox(x, y, w, h, title, color, names){
      // 外框
      ctx.fillStyle = COLORS.card; roundRectPath(ctx, x, y, w, h, 10); ctx.fill();
      ctx.strokeStyle = COLORS.line; ctx.lineWidth = 1; roundRectPath(ctx, x, y, w, h, 10); ctx.stroke();

      // 标题 + 彩点 + 计数
      setFont(13,true); ctx.fillStyle = COLORS.text;
      ctx.fillText(title, x + BOX_PAD, y + BOX_PAD + 14);
      ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x + BOX_PAD + 58, y + BOX_PAD + 10, 4, 0, Math.PI*2); ctx.fill();
      setFont(12,false); ctx.fillStyle = '#666';
      ctx.fillText(`(${names.length})`, x + BOX_PAD + 68, y + BOX_PAD + 14);

      // 标签区域
      let cx = x + BOX_PAD, cy = y + BOX_PAD + TITLE_H + 6;
      setFont(12,false);
      names.forEach(nm=>{
        const text = String(nm||'').trim();
        const tw = Math.ceil(ctx.measureText(text).width);
        const ww = tw + TAG_PAD_X*2;
        const avail = x + w - BOX_PAD;
        if(cx + ww > avail){
          cx = x + BOX_PAD;
          cy += TAG_H + TAG_GAP;
        }
        // 背景圆角
        ctx.fillStyle = '#f5f7fb';
        roundRectPath(ctx, cx, cy, ww, TAG_H, 999);
        ctx.fill();
        ctx.strokeStyle = COLORS.line; ctx.lineWidth = 1;
        roundRectPath(ctx, cx, cy, ww, TAG_H, 999);
        ctx.stroke();
        // 文本
        ctx.fillStyle = '#222';
        ctx.fillText(text, cx + TAG_PAD_X, cy + TAG_H/2 + 4);
        cx += ww + TAG_GAP;
      });
    }

    drawBox(boxX1, boxesTop, boxW, bottomBoxesH, '弟兄姊妹', '#35c28d', members);
    drawBox(boxX2, boxesTop, boxW, bottomBoxesH, '福音朋友', '#6aa5ff', friends);

    // 页脚
    setFont(11,false); ctx.fillStyle = '#888';
    ctx.fillText('Generated by InviteManager', P, Hbase - P);

    // 下载
    if (canvas.toBlob) {
      canvas.toBlob(blob=>{
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'InviteBoard_' + new Date().toISOString().slice(0,10) + '.png';
        a.click(); URL.revokeObjectURL(url);
      }, 'image/png');
    } else {
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = 'InviteBoard_' + new Date().toISOString().slice(0,10) + '.png';
      a.click();
    }
  }catch(e){
    console.error(e);
    alert('导出失败：' + e.message);
  }
}

  const DEFAULT_GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyMFQf63WaCWHGHMFWNIwab7Qda0cGupq4Q3upB5hS3ake43Xpe3K3Wkqka2vGh6Q-gTw/exec';

  async function syncToGoogleSheet(silent=false){
    const url = getGoogleScriptUrl();
    if(!url){ alert('请先点击“设置 Google 同步”，粘贴 Apps Script Web App URL。'); return; }
    setSyncStatus('正在同步…');
    try{
      const state = load();
      // 兼容 Google Sheet 旧版脚本：个人备注既保存在 personNotes，
      // 也附加到每个人的 note 字段，供表格的 note 列直接读取。
      state.personNotes = state.personNotes || {};
      state.people = (state.people||[]).map(person=>({
        ...person,
        note: state.personNotes[person.id] || ''
      }));
      // 同步过程只更新本地缓存，不再调用 save()，避免触发下一轮自动同步。
      localStorage.setItem(storeKey, JSON.stringify(state));

      const res = await fetch(url, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'save', state })
      });
      const data = await res.json();
      if(!data || !data.ok) throw new Error((data && data.error) || '同步失败');
      setSyncStatus('已同步 ' + new Date().toLocaleTimeString());
      localChangesPending = false;
      if(!silent) alert('已同步到 Google Sheet');
    }catch(err){
      console.error(err);
      setSyncStatus('同步失败');
      if(!silent) alert('同步失败：' + err.message + '\n\n请确认 Apps Script 已部署为 Web App，并允许访问。');
    }
  }

  async function loadFromGoogleSheet(silent=false){
    const url = getGoogleScriptUrl();
    if(!url){ alert('请先点击“设置 Google 同步”，粘贴 Apps Script Web App URL。'); return; }
    if(!silent && !confirm('从 Google Sheet 读取会覆盖当前浏览器里的实时名单。继续吗？')) return;
    if(silent && localChangesPending) return;
    setSyncStatus('正在读取…');
    try{
      const sep = url.includes('?') ? '&' : '?';
      const res = await fetch(url + sep + 'action=load&_=' + Date.now());
      const data = await res.json();
      if(!data || !data.ok) throw new Error((data && data.error) || '读取失败');
      if(!data.state) throw new Error('Google Sheet 中还没有云端数据');
      const state = data.state;
      if(!state.people || !state.statuses || !Array.isArray(state.history)) throw new Error('云端数据格式不正确');
      // 兼容表格按 people[].note 返回个人备注的格式。
      state.personNotes = state.personNotes || {};
      state.people.forEach(person=>{
        if(person && person.id && typeof person.note === 'string'){
          state.personNotes[person.id] = person.note;
        }
      });
      localStorage.setItem(storeKey, JSON.stringify(state));
      render();
      setSyncStatus('已读取 ' + new Date().toLocaleTimeString());
      if(!silent) alert('已从 Google Sheet 读取');
    }catch(err){
      console.error(err);
      setSyncStatus('读取失败');
      if(!silent) alert('读取失败：' + err.message);
    }
  }

    $('#newName').value='';
  });
  $('#newName').addEventListener('keypress', (e)=>{ if(e.key==='Enter') $('#addBtn').click(); });
  $('#toggleBulkBtn').addEventListener('click', ()=>{
    const box = $('#bulkBox');
    box.style.display = (box.style.display==='none' || !box.style.display) ? 'block' : 'none';
  });
  $('#bulkAddBtn').addEventListener('click', ()=>{ bulkAdd($('#bulkInput').value, $('#allowDup').checked); $('#bulkInput').value=''; });
  $('#exportBtn').addEventListener('click', exportJSON);
  $('#importBtn').addEventListener('click', ()=> $('#importFile').click());
  $('#importFile').addEventListener('change', (e)=>{ const f=e.target.files[0]; if(f) importJSON(f); e.target.value=''; });
  document.getElementById('pngBtn')?.addEventListener('click', exportBoardPNG);
  document.getElementById('googleSetupBtn')?.addEventListener('click', setupGoogleSync);
  document.getElementById('googleSaveBtn')?.addEventListener('click', ()=>syncToGoogleSheet(false));
  document.getElementById('googleLoadBtn')?.addEventListener('click', ()=>loadFromGoogleSheet(false));
  $('#cancelPersonNoteBtn').addEventListener('click', ()=>{
    editingPersonNoteId = null;
    $('#personNoteDialog').close();
  });
  $('#deletePersonBtn').addEventListener('click', ()=>{
    if(!editingPersonNoteId) return;
    const state = load();
    const person = (state.people||[]).find(p=>p.id === editingPersonNoteId);
    if(!confirm(`确定删除“${person?.name || '该人员'}”？`)) return;
    const id = editingPersonNoteId;
    editingPersonNoteId = null;
    $('#personNoteDialog').close();
    deletePerson(id);
    render();
  });
  $('#personNoteDialog').addEventListener('close', ()=>{
    if($('#personNoteDialog').returnValue !== 'save' || !editingPersonNoteId){
      editingPersonNoteId = null;
      return;
    }
    const state = load();
    const person = (state.people||[]).find(p=>p.id === editingPersonNoteId);
    const name = normalizedName($('#personNameInput').value);
    if(person && name) person.name = name;
    state.personNotes = state.personNotes || {};
    const note = $('#personNoteInput').value.trim();
    if(note) state.personNotes[editingPersonNoteId] = note;
    else delete state.personNotes[editingPersonNoteId];
    editingPersonNoteId = null;
    save(state);
    render();
  });

  // —— 初始化
  render();
  startAutomaticGoogleSync();
})();
</script>
</body>
</html>
